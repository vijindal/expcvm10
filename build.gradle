plugins {
    id 'java'
    id 'application'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = 'ui.Main'
}

sourceSets {
    main {
        java { srcDirs = ['src', 'legacy-archive'] }
        resources { srcDirs = [] }
    }
    test {
        java { srcDirs = ['src-test'] }
        resources { srcDirs = [] }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'com.google.code.gson:gson:2.11.0'
}

tasks.named('test', Test) {
    useJUnitPlatform {
        excludeTags 'exploratory', 'slow', 'integration-heavy', 'external'
    }
    workingDir = project.projectDir
    systemProperties System.properties.findAll { k, v ->
        k.toString().startsWith('sgte.') || k.toString().startsWith('tdb.')
    }
    // Bound forked test-JVM memory: with no limit here, Gradle defaults
    // maxParallelForks to (CPU cores / 2) and lets each forked JVM pick
    // its own default heap, which can exhaust memory on smaller machines.
    maxHeapSize = '512m'
    maxParallelForks = 1
}

tasks.register('testIntegrationHeavy', Test) {
    group = 'verification'
    description = 'Run integration-heavy tests (expensive multi-phase scenarios)'
    dependsOn testClasses
    useJUnitPlatform {
        includeTags 'integration-heavy'
    }
    workingDir = project.projectDir
    systemProperties System.properties.findAll { k, v ->
        k.toString().startsWith('sgte.') || k.toString().startsWith('tdb.')
    }
    maxHeapSize = '512m'
    maxParallelForks = 1
}

tasks.register('testSlow', Test) {
    group = 'verification'
    description = 'Run slow tests (parameter scans, grids, expensive numerical computations)'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'slow'
    }
    workingDir = project.projectDir
    systemProperties System.properties.findAll { k, v ->
        k.toString().startsWith('sgte.') || k.toString().startsWith('tdb.')
    }
    maxHeapSize = '512m'
    maxParallelForks = 1
}

tasks.register('testExplore', Test) {
    group = 'verification'
    description = 'Run exploratory tests (geometry generation, architecture validation, reference checks)'
    dependsOn testClasses
    useJUnitPlatform {
        includeTags 'exploratory'
    }
    workingDir = project.projectDir
    systemProperties System.properties.findAll { k, v ->
        k.toString().startsWith('sgte.') || k.toString().startsWith('tdb.')
    }
    maxHeapSize = '512m'
    maxParallelForks = 1
}

tasks.register('testExternal', Test) {
    group = 'verification'
    description = 'Run external dependency tests (CEWorkbench cross-checks, etc.)'
    dependsOn testClasses
    useJUnitPlatform {
        includeTags 'external'
    }
    workingDir = project.projectDir
    systemProperties System.properties.findAll { k, v ->
        k.toString().startsWith('sgte.') || k.toString().startsWith('tdb.')
    }
    maxHeapSize = '512m'
    maxParallelForks = 1
}

tasks.register('testAll', Test) {
    group = 'verification'
    description = 'Run all tests (core, integration, slow, exploratory, external)'
    dependsOn testClasses
    useJUnitPlatform()
    workingDir = project.projectDir
    systemProperties System.properties.findAll { k, v ->
        k.toString().startsWith('sgte.') || k.toString().startsWith('tdb.')
    }
    maxHeapSize = '512m'
    maxParallelForks = 1
}

tasks.named('run') {
    workingDir = project.projectDir
    // Only the interactive CLI (no args, or args not starting with --gui)
    // reads stdin (see ui.cli.CliApp's Prompter); wiring System.in
    // unconditionally makes `gradlew run --args="--gui"` hang/misbehave
    // under a non-interactive caller (CI, IDE launcher, agent tooling)
    // that provides no real stdin.
    doFirst {
        if (!args.contains('--gui')) {
            standardInput = System.in
        }
    }
}

tasks.register('fatJar', Jar) {
    group       = 'build'
    description = 'Assembles an executable JAR with Main-Class manifest.'
    destinationDirectory = layout.projectDirectory.dir('dist')
    archiveFileName      = 'expcvm10.jar'
    manifest {
        attributes('Main-Class': 'ui.Main', 'Implementation-Title': 'expcvm10')
    }
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn classes
}

tasks.named('build') { dependsOn fatJar }
tasks.named('clean') { delete 'dist' }

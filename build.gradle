plugins {
    id 'java'
    id 'application'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = 'ui.Main'
}

sourceSets {
    main {
        java { srcDirs = ['src', 'legacy-archive'] }
        resources { srcDirs = [] }
    }
    test {
        java { srcDirs = ['src-test'] }
        resources { srcDirs = [] }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'com.google.code.gson:gson:2.11.0'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    filter {
        includeTestsMatching 'calc.equil.EquilibriumSolverV2TwoPhaseEndToEndTest'
    }
    workingDir = project.projectDir
    systemProperties System.properties.findAll { k, v ->
        k.toString().startsWith('sgte.') || k.toString().startsWith('tdb.')
    }
}

tasks.named('run') {
    workingDir = project.projectDir
}

tasks.register('fatJar', Jar) {
    group       = 'build'
    description = 'Assembles an executable JAR with Main-Class manifest.'
    destinationDirectory = layout.projectDirectory.dir('dist')
    archiveFileName      = 'expcvm10.jar'
    manifest {
        attributes('Main-Class': 'ui.Main', 'Implementation-Title': 'expcvm10')
    }
    from sourceSets.main.output
    dependsOn classes
}

tasks.named('build') { dependsOn fatJar }
tasks.named('clean') { delete 'dist' }
